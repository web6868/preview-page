<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模板页 · Template</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Microsoft YaHei', sans-serif;
        background: #f5f7fa;
        color: #303133;
      }
      .wrap {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }
      .card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        padding: 32px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; }
      .tag {
        display: inline-block;
        background: #ecf5ff;
        color: #409eff;
        border-radius: 4px;
        padding: 2px 10px;
        font-size: 12px;
        margin-bottom: 16px;
      }
      p { line-height: 1.7; color: #606266; }
      code {
        background: #f0f2f5;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
      }
      .footer { margin-top: 20px; font-size: 12px; color: #c0c4cc; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <span class="tag">TEMPLATE</span>
        <h1>通用页面模板</h1>
        <p>
          这是一个独立、自包含的静态模板页，由 <code>public/template/index.html</code>
          在构建时自动复制到 <code>dist/template/</code> 目录。
        </p>
        <p>
          可直接在此编辑 HTML / CSS / JS，作为预览中心里某个页面的独立内容。
          部署到 GitHub Pages（仓库名 <code>preview-page</code>）后，可通过
          <code>/preview-page/template/</code> 路径访问本页。
        </p>
        <p class="footer">Generated template · 可直接替换为任意静态页面内容。</p>
      </div>
    </div>
  </body>
</html>
